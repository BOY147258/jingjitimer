<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发令音效测试 - 竞迹</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #12121f 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #ff6200;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .test-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .test-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-gejiuwei { background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; }
    .btn-yubei { background: linear-gradient(135deg, #FFC107, #ffb300); color: #000; }
    .btn-gunshot { background: linear-gradient(135deg, #f44336, #e53935); color: #fff; }
    .btn-recall { background: linear-gradient(135deg, #9C27B0, #8e24aa); color: #fff; }
    .btn-all { background: linear-gradient(135deg, #ff6200, #ff8534); color: #fff; }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }
    .status-error { color: #f44336; }
    .status-success { color: #4CAF50; }
    .status-info { color: #2196F3; }

    .system-info {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      font-size: 13px;
    }
    .system-info h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .system-info p { margin: 4px 0; color: rgba(255,255,255,0.7); }
    .system-info p span { color: #4CAF50; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔊 发令音效测试</h1>

    <div class="test-card">
      <div class="test-title">1️⃣ 第一步：先点这个初始化语音系统</div>
      <button onclick="initVoice()" style="width:100%;background:linear-gradient(135deg,#2196F3,#1976D2);color:#fff;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer">
        🔊 初始化语音系统（必须先点）
      </button>
    </div>

    <div class="test-card">
      <div class="test-title">2️⃣ 第二步：测试各个音效</div>
      <div class="btn-row">
        <button class="btn-gejiuwei" onclick="testGeJiuWei()" id="btn1" disabled>📢 各就位</button>
        <button class="btn-yubei" onclick="testYuBei()" id="btn2" disabled>⚡ 预备</button>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-gunshot" onclick="testGunshot()" id="btn3" disabled>🔫 枪声</button>
        <button class="btn-recall" onclick="testRecall()" id="btn4" disabled>📢 召回</button>
      </div>
    </div>

    <div class="test-card">
      <div class="test-title">3️⃣ 第三步：完整发令序列</div>
      <button class="btn-all" onclick="testFullSequence()" id="btn5" disabled>▶️ 播放完整发令（各就位→预备→枪声）</button>
    </div>

    <div class="status" id="status">
      <div class="status-info">请按顺序操作：先点"初始化语音系统"，然后再测试音效</div>
    </div>

    <div class="system-info">
      <h3>📱 系统信息</h3>
      <p>语音合成 (SpeechSynthesis): <span id="speech-support">检测中...</span></p>
      <p>Web Audio API: <span id="audio-support">检测中...</span></p>
      <p>可用的中文语音数量: <span id="voice-count">检测中...</span></p>
    </div>
  </div>

  <script>
    // 检测系统支持
    if ('speechSynthesis' in window) {
      document.getElementById('speech-support').innerHTML = '✅ 支持';
    } else {
      document.getElementById('speech-support').innerHTML = '❌ 不支持';
    }

    if (window.AudioContext || window.webkitAudioContext) {
      document.getElementById('audio-support').innerHTML = '✅ 支持';
    } else {
      document.getElementById('audio-support').innerHTML = '❌ 不支持';
    }

    // 等待语音列表加载
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      document.getElementById('voice-count').textContent = voices.length + ' 个';

      // 找中文语音
      const chineseVoices = voices.filter(v => v.lang.includes('zh'));
      if (chineseVoices.length > 0) {
        document.getElementById('voice-count').textContent =
          chineseVoices.length + ' 个中文语音可用: ' + chineseVoices.map(v => v.name.substring(0, 20)).join(', ');
      }
    }

    // 语音列表可能在加载完成后才可用
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    let audioCtx = null;

    function log(msg, type = 'info') {
      const status = document.getElementById('status');
      const div = document.createElement('div');
      div.className = 'status-' + type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      status.appendChild(div);
      status.scrollTop = status.scrollHeight;
    }

    // 初始化语音系统
    function initVoice() {
      // 初始化 Web Audio API
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // 恢复 AudioContext（如果被暂停）
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // 预加载语音（某些浏览器需要）
      speechSynthesis.getVoices();
      speechSynthesis.cancel(); // 清除之前的

      log('✅ 语音系统已初始化', 'success');
      log('🎤 Web Audio: ' + audioCtx.state, 'info');

      // 启用按钮
      document.getElementById('btn1').disabled = false;
      document.getElementById('btn2').disabled = false;
      document.getElementById('btn3').disabled = false;
      document.getElementById('btn4').disabled = false;
      document.getElementById('btn5').disabled = false;

      // 测试语音是否能工作
      const utterance = new SpeechSynthesisUtterance(' ');
      utterance.volume = 0;
      speechSynthesis.speak(utterance);
    }

    // 说中文
    function speakChinese(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);

        // 尝试找中文语音
        const voices = speechSynthesis.getVoices();
        const chineseVoice = voices.find(v => v.lang.includes('zh')) ||
                            voices.find(v => v.lang.includes('CN')) ||
                            voices[0];

        if (chineseVoice) {
          utterance.voice = chineseVoice;
        }

        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;  // 稍慢一点，更有力
        utterance.pitch = 0.8; // 稍低一点，更有男声感
        utterance.volume = 1.0; // 最大音量

        utterance.onend = resolve;
        utterance.onerror = resolve;

        speechSynthesis.speak(utterance);
      });
    }

    // 各就位 - 男声大声喊
    async function testGeJiuWei() {
      log('📢 播放: 各就位...', 'info');
      await speakChinese('各就位');
      log('✅ 各就位 已播放', 'success');
    }

    // 预备 - 男声大声喊
    async function testYuBei() {
      log('⚡ 播放: 预备...', 'info');
      await speakChinese('预备');
      log('✅ 预备 已播放', 'success');
    }

    // 发令哨音 - 高频尖锐、短促有力、所有人都能听到
    async function testGunshot() {
      log('🔫 播放: 发令哨音...', 'info');
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      // 高频哨音 - 3000Hz，尖锐刺耳，短促有力
      // 1. 主哨音 - 高频正弦波
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(3000, now); // 高频哨音
      osc1.frequency.setValueAtTime(3200, now + 0.05); // 轻微上滑更有力
      gain1.gain.setValueAtTime(0, now);
      gain1.gain.linearRampToValueAtTime(1.0, now + 0.01); // 立即达到最大音量
      gain1.gain.setValueAtTime(1.0, now + 0.15); // 保持
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.25); // 突然停止
      osc1.connect(gain1);
      gain1.connect(ctx.destination);

      // 2. 泛音层 - 让声音更尖锐有力
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'triangle';
      osc2.frequency.setValueAtTime(4500, now); // 更高频泛音
      gain2.gain.setValueAtTime(0, now);
      gain2.gain.linearRampToValueAtTime(0.4, now + 0.01);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);

      // 3. 初始脉冲 - 开头那一下的爆发感
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.type = 'sawtooth';
      osc3.frequency.setValueAtTime(5000, now);
      osc3.frequency.exponentialRampToValueAtTime(3000, now + 0.03);
      gain3.gain.setValueAtTime(0.5, now);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
      osc3.connect(gain3);
      gain3.connect(ctx.destination);

      // 4. 轻微颤音 - 让声音更有存在感
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      lfo.type = 'sine';
      lfo.frequency.value = 30; // 30Hz颤音
      lfoGain.gain.value = 50; // 轻微颤动
      lfo.connect(lfoGain);
      lfoGain.connect(osc1.frequency);

      osc1.start(now);
      osc2.start(now);
      osc3.start(now);
      lfo.start(now);

      osc1.stop(now + 0.25);
      osc2.stop(now + 0.2);
      osc3.stop(now + 0.03);
      lfo.stop(now + 0.25);

      await new Promise(r => setTimeout(r, 300));
      log('🔫 哨音 已播放 (3000Hz 高频哨声)', 'success');
    }

    // 召回音效
    async function testRecall() {
      log('📢 播放: 召回信号...', 'info');
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

      for (let i = 0; i < 5; i++) {
        await speakChinese('召回');
        await new Promise(r => setTimeout(r, 100));
      }

      log('📢 召回信号 已播放', 'success');
    }

    // 完整发令序列
    async function testFullSequence() {
      log('▶️ 开始完整发令序列...', 'info');

      // 各就位
      await testGeJiuWei();
      await new Promise(r => setTimeout(r, 600));

      // 等待
      log('⏳ 等待发令...', 'info');
      await new Promise(r => setTimeout(r, 2000));

      // 预备
      await testYuBei();
      await new Promise(r => setTimeout(r, 600));

      // 随机等待 (1.5-2.5秒)
      const waitTime = 1500 + Math.random() * 1000;
      log('⏳ 等待随机时间...', 'info');
      await new Promise(r => setTimeout(r, waitTime));

      // 枪声
      await testGunshot();

      log('🎉 完整发令序列完成!', 'success');
    }
  </script>
</body>
</html>
