<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发令音效测试 - 竞迹</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #12121f 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #ff6200;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .test-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .test-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-init { background: linear-gradient(135deg, #2196F3, #1976D2); color: #fff; }
    .btn-gejiuwei { background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; }
    .btn-yubei { background: linear-gradient(135deg, #FFC107, #ffb300); color: #000; }
    .btn-gunshot { background: linear-gradient(135deg, #f44336, #e53935); color: #fff; }
    .btn-all { background: linear-gradient(135deg, #ff6200, #ff8534); color: #fff; }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }
    .status-error { color: #f44336; }
    .status-success { color: #4CAF50; }
    .status-info { color: #2196F3; }

    .system-info {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      font-size: 13px;
    }
    .system-info h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .system-info p { margin: 4px 0; color: rgba(255,255,255,0.7); }
    .specs {
      background: rgba(255,98,0,0.1);
      border: 1px solid rgba(255,98,0,0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .specs h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .specs p { margin: 4px 0; font-size: 12px; color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔊 国际标准电子发令音效测试</h1>

    <div class="test-card">
      <div class="test-title">第一步：初始化音频系统</div>
      <button class="btn-init" onclick="initVoice()" style="width:100%;padding:16px;font-size:16px">
        🔊 初始化（必须先点）
      </button>
    </div>

    <div class="test-card">
      <div class="test-title">第二步：测试各个音效</div>
      <div class="btn-row">
        <button class="btn-gejiuwei" onclick="testGeJiuWei()" id="btn1" disabled>📢 各就位</button>
        <button class="btn-yubei" onclick="testYuBei()" id="btn2" disabled>⚡ 预备</button>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-gunshot" onclick="testHorn()" id="btn3" disabled>🏁 标准发令哨音</button>
      </div>
    </div>

    <div class="test-card">
      <div class="test-title">第三步：完整国际标准发令序列</div>
      <button class="btn-all" onclick="testFullSequence()" id="btn4" disabled>
        ▶️ 完整发令（各就位→预备→哨音）
      </button>
    </div>

    <div class="status" id="status">
      <div class="status-info">请按顺序操作</div>
    </div>

    <div class="specs">
      <h3>📋 国际标准参数</h3>
      <p>• 哨音频率：2000Hz（正弦波纯音）</p>
      <p>• 哨音时长：1.5秒（国际标准）</p>
      <p>• 各就位到预备：等待运动员就位</p>
      <p>• 预备到发令：0.7-2.0秒随机</p>
      <p>• 音量：最大音量，渐入渐出</p>
    </div>

    <div class="system-info">
      <h3>📱 系统信息</h3>
      <p>语音合成: <span id="speech-support">检测中...</span></p>
      <p>Web Audio API: <span id="audio-support">检测中...</span></p>
    </div>
  </div>

  <script>
    // 检测系统支持
    if ('speechSynthesis' in window) {
      document.getElementById('speech-support').textContent = '✅ 支持';
    } else {
      document.getElementById('speech-support').textContent = '❌ 不支持';
    }

    if (window.AudioContext || window.webkitAudioContext) {
      document.getElementById('audio-support').textContent = '✅ 支持';
    } else {
      document.getElementById('audio-support').textContent = '❌ 不支持';
    }

    let audioCtx = null;

    function log(msg, type = 'info') {
      const status = document.getElementById('status');
      const div = document.createElement('div');
      div.className = 'status-' + type;
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      status.appendChild(div);
      status.scrollTop = status.scrollHeight;
      console.log(msg);
    }

    // 初始化
    function initVoice() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      speechSynthesis.getVoices();
      speechSynthesis.cancel();

      log('✅ 音频系统已初始化', 'success');

      document.getElementById('btn1').disabled = false;
      document.getElementById('btn2').disabled = false;
      document.getElementById('btn3').disabled = false;
      document.getElementById('btn4').disabled = false;
    }

    // 中文语音
    function speakChinese(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const chineseVoice = voices.find(v => v.lang.includes('zh')) ||
                            voices.find(v => v.lang.includes('CN')) || voices[0];
        if (chineseVoice) utterance.voice = chineseVoice;
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;
        utterance.pitch = 0.75;
        utterance.volume = 1.0;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    // 各就位
    async function testGeJiuWei() {
      log('📢 播放: 各就位...', 'info');
      await speakChinese('各就位');
      log('✅ 各就位 已播放', 'success');
    }

    // 预备
    async function testYuBei() {
      log('⚡ 播放: 预备...', 'info');
      await speakChinese('预备');
      log('✅ 预备 已播放', 'success');
    }

    // 国际标准发令哨音
    // 参数：2000Hz正弦波，1.5秒，渐入渐出
    async function testHorn() {
      log('🏁 播放: 国际标准发令哨音 (2000Hz, 1.5秒)...', 'info');
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      // 国际标准参数
      const FREQ = 2000;      // 2000Hz 标准频率
      const DURATION = 1.5;   // 1.5秒 标准时长
      const RISE_TIME = 0.02; // 20ms 渐入
      const FALL_TIME = 0.1;  // 100ms 渐出

      // 主哨音 - 纯正弦波
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(FREQ, now);

      // 音量包络：渐入 → 保持 → 渐出
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(1.0, now + RISE_TIME);      // 渐入
      gain.gain.setValueAtTime(1.0, now + DURATION - FALL_TIME);     // 保持
      gain.gain.exponentialRampToValueAtTime(0.001, now + DURATION);  // 渐出

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + DURATION);

      // 添加轻微谐波增强（可选，让声音更饱满但不失真）
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(FREQ * 2, now); // 4000Hz 泛音
      gain2.gain.setValueAtTime(0, now);
      gain2.gain.linearRampToValueAtTime(0.15, now + RISE_TIME);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + DURATION);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + DURATION);

      await new Promise(r => setTimeout(r, DURATION * 1000 + 200));
      log('🏁 哨音 已播放 (2000Hz, 1.5秒)', 'success');
    }

    // 完整发令序列
    async function testFullSequence() {
      log('▶️ 开始国际标准发令序列...', 'info');

      // 各就位
      await testGeJiuWei();
      await new Promise(r => setTimeout(r, 800));
      log('⏳ 等待运动员就位...', 'info');

      // 预备
      await testYuBei();
      await new Promise(r => setTimeout(r, 600));
      log('⏳ 等待发令...', 'info');

      // 随机等待 0.7-2.0秒（国际标准）
      const waitTime = 700 + Math.random() * 1300;
      log('⏳ 随机等待 ' + (waitTime/1000).toFixed(1) + '秒...', 'info');
      await new Promise(r => setTimeout(r, waitTime));

      // 发令哨音
      await testHorn();

      log('🎉 国际标准发令序列完成!', 'success');
    }
  </script>
</body>
</html>
