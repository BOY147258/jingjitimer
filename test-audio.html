<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发令音效测试 - 竞迹</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #12121f 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #ff6200;
      margin-bottom: 30px;
      font-size: 24px;
    }
    h1 span { display: block; font-size: 14px; color: #888; margin-top: 8px; }

    .test-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .test-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      padding: 16px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-init { background: linear-gradient(135deg, #2196F3, #1976D2); color: #fff; }
    .btn-gejiuwei { background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; }
    .btn-yubei { background: linear-gradient(135deg, #FFC107, #ffb300); color: #000; }
    .btn-gunshot { background: linear-gradient(135deg, #f44336, #e53935); color: #fff; }
    .btn-all { background: linear-gradient(135deg, #ff6200, #ff8534); color: #fff; }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider {
      text-align: center;
      color: #666;
      font-size: 12px;
      margin: 20px 0;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }
    .status-error { color: #f44336; }
    .status-success { color: #4CAF50; }
    .status-info { color: #2196F3; }

    .specs {
      background: rgba(255,98,0,0.1);
      border: 1px solid rgba(255,98,0,0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .specs h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .specs p { margin: 4px 0; font-size: 12px; color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      🔊 电子发令音效
      <span>各就位 + 预备 + 枪声</span>
    </h1>

    <div class="test-card">
      <div class="test-title">第一步：初始化音频系统</div>
      <button class="btn-init" onclick="initVoice()" style="width:100%;padding:18px;font-size:16px">
        🔊 初始化音频系统
      </button>
    </div>

    <div class="test-card">
      <div class="test-title">第二步：分开按（自己控制节奏）</div>
      <div class="btn-row">
        <button class="btn-gejiuwei" onclick="testGeJiuWei()" id="btn1" disabled>📢 各就位</button>
        <button class="btn-yubei" onclick="testYuBei()" id="btn2" disabled>⚡ 预备</button>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-gunshot" onclick="testHorn()" id="btn3" disabled>🔫 发令枪声</button>
      </div>
    </div>

    <div class="divider">━━━━━━━━━━ 或 ━━━━━━━━━━</div>

    <div class="test-card">
      <div class="test-title">第三步：一键完整发令（各就位→预备→枪声）</div>
      <button class="btn-all" onclick="testFullSequence()" id="btn4" disabled style="padding:20px;font-size:18px">
        ▶️ 完整发令
      </button>
    </div>

    <div class="specs">
      <h3>📋 电子枪声参数</h3>
      <p>• 频率：2000Hz 正弦波</p>
      <p>• 时长：0.5秒（短促有力）</p>
      <p>• 无尾音，干脆利落</p>
    </div>

    <div class="status" id="status">
      <div class="status-info">点击上方按钮测试</div>
    </div>
  </div>

  <script>
    let audioCtx = null;

    function log(msg, type = 'info') {
      const status = document.getElementById('status');
      const div = document.createElement('div');
      div.className = 'status-' + type;
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      status.appendChild(div);
      status.scrollTop = status.scrollHeight;
      console.log(msg);
    }

    // 初始化
    function initVoice() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      speechSynthesis.getVoices();
      speechSynthesis.cancel();

      log('✅ 音频系统已初始化', 'success');

      document.getElementById('btn1').disabled = false;
      document.getElementById('btn2').disabled = false;
      document.getElementById('btn3').disabled = false;
      document.getElementById('btn4').disabled = false;
    }

    // 中文语音 - 各就位/预备 加大音量
    function speakChinese(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const chineseVoice = voices.find(v => v.lang.includes('zh')) ||
                            voices.find(v => v.lang.includes('CN')) || voices[0];
        if (chineseVoice) utterance.voice = chineseVoice;
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;   // 稍慢一点更清晰
        utterance.pitch = 0.7;   // 偏低沉有力
        utterance.volume = 1.5;  // 加大音量（最大）
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    // 各就位
    async function testGeJiuWei() {
      log('📢 播放: 各就位', 'info');
      await speakChinese('各就位');
      log('✅ 各就位 完成', 'success');
    }

    // 预备
    async function testYuBei() {
      log('⚡ 播放: 预备', 'info');
      await speakChinese('预备');
      log('✅ 预备 完成', 'success');
    }

    // 电子发令枪声 - 有力持久
    async function testHorn() {
      log('🔫 播放: 发令枪声', 'info');
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      const FREQ = 2000;  // 2000Hz 标准频率
      const DURATION = 1.5; // 1.5秒，持续有力

      // 1. 起始爆破 (0-40ms) - 更强力的爆破感
      const blastLength = ctx.sampleRate * 0.04;
      const blastBuffer = ctx.createBuffer(1, blastLength, ctx.sampleRate);
      const blastData = blastBuffer.getChannelData(0);
      for (let i = 0; i < blastLength; i++) {
        blastData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.008));
      }
      const blast = ctx.createBufferSource();
      blast.buffer = blastBuffer;
      const blastFilter = ctx.createBiquadFilter();
      blastFilter.type = 'highpass';
      blastFilter.frequency.value = 800;
      const blastGain = ctx.createGain();
      blastGain.gain.setValueAtTime(1.0, now);  // 最大音量
      blastGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
      blast.connect(blastFilter);
      blastFilter.connect(blastGain);
      blastGain.connect(ctx.destination);

      // 2. 主体哨音 (0-1400ms) - 2000Hz正弦波，持续有力
      const mainOsc = ctx.createOscillator();
      const mainGain = ctx.createGain();
      mainOsc.type = 'sine';
      mainOsc.frequency.setValueAtTime(FREQ, now);
      // 渐入 → 持续全音量 → 渐出
      mainGain.gain.setValueAtTime(0, now);
      mainGain.gain.linearRampToValueAtTime(1.0, now + 0.02);
      mainGain.gain.setValueAtTime(1.0, now + 1.3);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

      mainOsc.connect(mainGain);
      mainGain.connect(ctx.destination);

      // 3. 泛音层 (0-1200ms) - 增加力度感
      const harmOsc = ctx.createOscillator();
      const harmGain = ctx.createGain();
      harmOsc.type = 'sine';
      harmOsc.frequency.setValueAtTime(FREQ * 2, now); // 4000Hz
      harmGain.gain.setValueAtTime(0, now);
      harmGain.gain.linearRampToValueAtTime(0.3, now + 0.02);
      harmGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
      harmOsc.connect(harmGain);
      harmGain.connect(ctx.destination);

      // 4. 低频轰鸣 (0-300ms) - 增加厚重感
      const lowOsc = ctx.createOscillator();
      const lowGain = ctx.createGain();
      lowOsc.type = 'sine';
      lowOsc.frequency.setValueAtTime(120, now);
      lowOsc.frequency.exponentialRampToValueAtTime(60, now + 0.3);
      lowGain.gain.setValueAtTime(0.5, now);
      lowGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      lowOsc.connect(lowGain);
      lowGain.connect(ctx.destination);

      // 启动
      blast.start(now);
      mainOsc.start(now);
      harmOsc.start(now);
      lowOsc.start(now);

      // 停止
      blast.stop(now + 0.04);
      mainOsc.stop(now + 1.5);
      harmOsc.stop(now + 1.2);
      lowOsc.stop(now + 0.3);

      await new Promise(r => setTimeout(r, 1600));
      log('🔫 枪声 完成 (2000Hz, 1.5秒)', 'success');
    }

    // 完整发令序列
    async function testFullSequence() {
      log('▶️ 发令序列开始...', 'info');

      // 各就位
      await testGeJiuWei();
      await new Promise(r => setTimeout(r, 600));

      // 预备
      await testYuBei();
      await new Promise(r => setTimeout(r, 400));

      // 枪声
      await testHorn();

      log('✅ 发令完成！', 'success');
    }
  </script>
</body>
</html>
