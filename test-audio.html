<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发令音效测试 - 竞迹</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a14 0%, #12121f 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 500px; margin: 0 auto; }
    h1 {
      text-align: center;
      color: #ff6200;
      margin-bottom: 30px;
      font-size: 24px;
    }
    .test-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .test-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      flex: 1;
      min-width: 100px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-init { background: linear-gradient(135deg, #2196F3, #1976D2); color: #fff; }
    .btn-gejiuwei { background: linear-gradient(135deg, #4CAF50, #45a049); color: #fff; }
    .btn-yubei { background: linear-gradient(135deg, #FFC107, #ffb300); color: #000; }
    .btn-gunshot { background: linear-gradient(135deg, #f44336, #e53935); color: #fff; }
    .btn-all { background: linear-gradient(135deg, #ff6200, #ff8534); color: #fff; }

    button:active { transform: scale(0.95); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
    }
    .status-error { color: #f44336; }
    .status-success { color: #4CAF50; }
    .status-info { color: #2196F3; }

    .system-info {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      font-size: 13px;
    }
    .system-info h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .system-info p { margin: 4px 0; color: rgba(255,255,255,0.7); }
    .specs {
      background: rgba(255,98,0,0.1);
      border: 1px solid rgba(255,98,0,0.3);
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .specs h3 { color: #ff6200; margin-bottom: 10px; font-size: 14px; }
    .specs p { margin: 4px 0; font-size: 12px; color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      🔊 国际标准电子发令音效
      <span style="display:block;font-size:14px;color:#888;margin-top:8px">各就位 + 预备 + 电子枪声</span>
    </h1>

    <div class="test-card">
      <div class="test-title">第一步：初始化音频系统</div>
      <button class="btn-init" onclick="initVoice()" style="width:100%;padding:16px;font-size:16px">
        🔊 初始化（必须先点）
      </button>
    </div>

    <div class="test-card">
      <div class="test-title">第二步：测试各个音效</div>
      <div class="btn-row">
        <button class="btn-gejiuwei" onclick="testGeJiuWei()" id="btn1" disabled>📢 各就位</button>
        <button class="btn-yubei" onclick="testYuBei()" id="btn2" disabled>⚡ 预备</button>
      </div>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-gunshot" onclick="testHorn()" id="btn3" disabled>🏁 标准发令哨音</button>
      </div>
    </div>

    <div class="test-card">
      <div class="test-title">第三步：完整发令序列（含随机编排）</div>
      <button class="btn-all" onclick="testFullSequence()" id="btn4" disabled>
        ▶️ 完整发令（各就位→预备→电子枪声 + 随机等待）
      </button>
      <p style="margin-top:10px;font-size:12px;color:rgba(255,255,255,0.5)">
        完整序列：各就位 → 等待 → 预备 → 随机0.7-2.0秒 → 枪声
      </p>
    </div>

    <div class="status" id="status">
      <div class="status-info">请按顺序操作</div>
    </div>

    <div class="specs">
      <h3>📋 国际标准参数</h3>
      <p>• 哨音频率：2000Hz（正弦波纯音）</p>
      <p>• 哨音时长：1.5秒（国际标准）</p>
      <p>• 各就位到预备：等待运动员就位</p>
      <p>• 预备到发令：0.7-2.0秒随机</p>
      <p>• 音量：最大音量，渐入渐出</p>
    </div>

    <div class="system-info">
      <h3>📱 系统信息</h3>
      <p>语音合成: <span id="speech-support">检测中...</span></p>
      <p>Web Audio API: <span id="audio-support">检测中...</span></p>
    </div>
  </div>

  <script>
    // 检测系统支持
    if ('speechSynthesis' in window) {
      document.getElementById('speech-support').textContent = '✅ 支持';
    } else {
      document.getElementById('speech-support').textContent = '❌ 不支持';
    }

    if (window.AudioContext || window.webkitAudioContext) {
      document.getElementById('audio-support').textContent = '✅ 支持';
    } else {
      document.getElementById('audio-support').textContent = '❌ 不支持';
    }

    let audioCtx = null;

    function log(msg, type = 'info') {
      const status = document.getElementById('status');
      const div = document.createElement('div');
      div.className = 'status-' + type;
      div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
      status.appendChild(div);
      status.scrollTop = status.scrollHeight;
      console.log(msg);
    }

    // 初始化
    function initVoice() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      speechSynthesis.getVoices();
      speechSynthesis.cancel();

      log('✅ 音频系统已初始化', 'success');

      document.getElementById('btn1').disabled = false;
      document.getElementById('btn2').disabled = false;
      document.getElementById('btn3').disabled = false;
      document.getElementById('btn4').disabled = false;
    }

    // 中文语音
    function speakChinese(text) {
      return new Promise((resolve) => {
        const utterance = new SpeechSynthesisUtterance(text);
        const voices = speechSynthesis.getVoices();
        const chineseVoice = voices.find(v => v.lang.includes('zh')) ||
                            voices.find(v => v.lang.includes('CN')) || voices[0];
        if (chineseVoice) utterance.voice = chineseVoice;
        utterance.lang = 'zh-CN';
        utterance.rate = 0.85;
        utterance.pitch = 0.75;
        utterance.volume = 1.0;
        utterance.onend = resolve;
        utterance.onerror = resolve;
        speechSynthesis.speak(utterance);
      });
    }

    // 各就位
    async function testGeJiuWei() {
      log('📢 播放: 各就位...', 'info');
      await speakChinese('各就位');
      log('✅ 各就位 已播放', 'success');
    }

    // 预备
    async function testYuBei() {
      log('⚡ 播放: 预备...', 'info');
      await speakChinese('预备');
      log('✅ 预备 已播放', 'success');
    }

    // 国际标准发令枪声
    // 包含：起始爆破 + 主体哨音 + 混响尾音
    // 2000Hz标准频率 + 有力的爆破起始
    async function testHorn() {
      log('🔫 播放: 电子发令枪声...', 'info');
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;

      const FREQ = 2000;      // 2000Hz 标准频率
      const TOTAL_DURATION = 1.5;

      // ========== 1. 起始爆破瞬态 (0-50ms) ==========
      // 快速噪声爆破 - 模拟真实枪声的"啪"声
      const blastLength = ctx.sampleRate * 0.05;
      const blastBuffer = ctx.createBuffer(1, blastLength, ctx.sampleRate);
      const blastData = blastBuffer.getChannelData(0);
      for (let i = 0; i < blastLength; i++) {
        // 指数衰减的噪声
        blastData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.008));
      }
      const blast = ctx.createBufferSource();
      blast.buffer = blastBuffer;

      // 高通滤波 - 让爆破声更尖锐
      const blastFilter = ctx.createBiquadFilter();
      blastFilter.type = 'highpass';
      blastFilter.frequency.value = 800;

      // 爆破增益 - 立即达到最大然后快速衰减
      const blastGain = ctx.createGain();
      blastGain.gain.setValueAtTime(0.8, now);
      blastGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      blast.connect(blastFilter);
      blastFilter.connect(blastGain);
      blastGain.connect(ctx.destination);

      // ========== 2. 主体哨音 (0-1400ms) ==========
      // 2000Hz 正弦波 - 国际标准频率
      const mainOsc = ctx.createOscillator();
      const mainGain = ctx.createGain();

      mainOsc.type = 'sine';
      mainOsc.frequency.setValueAtTime(FREQ, now);

      // 音量包络：渐入(20ms) → 保持 → 渐出(150ms)
      mainGain.gain.setValueAtTime(0, now);
      mainGain.gain.linearRampToValueAtTime(1.0, now + 0.02);
      mainGain.gain.setValueAtTime(1.0, now + 1.25);
      mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

      mainOsc.connect(mainGain);
      mainGain.connect(ctx.destination);

      // ========== 3. 泛音层 - 让声音更饱满有力 ==========
      const harmOsc = ctx.createOscillator();
      const harmGain = ctx.createGain();

      harmOsc.type = 'sine';
      harmOsc.frequency.setValueAtTime(FREQ * 2, now); // 4000Hz 泛音

      harmGain.gain.setValueAtTime(0, now);
      harmGain.gain.linearRampToValueAtTime(0.2, now + 0.02);
      harmGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

      harmOsc.connect(harmGain);
      harmGain.connect(ctx.destination);

      // ========== 4. 低频轰鸣 - 增加厚重感 ==========
      const lowOsc = ctx.createOscillator();
      const lowGain = ctx.createGain();

      lowOsc.type = 'sine';
      lowOsc.frequency.setValueAtTime(100, now);
      lowOsc.frequency.exponentialRampToValueAtTime(50, now + 0.3);

      lowGain.gain.setValueAtTime(0.4, now);
      lowGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

      lowOsc.connect(lowGain);
      lowGain.connect(ctx.destination);

      // ========== 5. 混响尾音 (1000-1500ms) ==========
      const reverbOsc = ctx.createOscillator();
      const reverbGain = ctx.createGain();

      reverbOsc.type = 'sine';
      reverbOsc.frequency.setValueAtTime(FREQ * 0.5, now + 0.8); // 低频混响

      reverbGain.gain.setValueAtTime(0, now + 0.8);
      reverbGain.gain.linearRampToValueAtTime(0.3, now + 0.9);
      reverbGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

      reverbOsc.connect(reverbGain);
      reverbGain.connect(ctx.destination);

      // ========== 启动所有音源 ==========
      blast.start(now);
      mainOsc.start(now);
      harmOsc.start(now);
      lowOsc.start(now);
      reverbOsc.start(now + 0.8);

      // ========== 停止所有音源 ==========
      blast.stop(now + 0.05);
      mainOsc.stop(now + 1.4);
      harmOsc.stop(now + 1.2);
      lowOsc.stop(now + 0.4);
      reverbOsc.stop(now + 1.5);

      await new Promise(r => setTimeout(r, TOTAL_DURATION * 1000 + 200));
      log('🔫 电子发令枪声 已播放 (2000Hz+爆破, 1.5秒)', 'success');
    }

    // 完整发令序列
    async function testFullSequence() {
      log('▶️ 发令序列开始...', 'info');

      // 各就位
      await testGeJiuWei();
      await new Promise(r => setTimeout(r, 800));
      log('⏳ 等待运动员就位...', 'info');

      // 预备
      await testYuBei();
      await new Promise(r => setTimeout(r, 600));

      // 0.4~0.9秒随机延迟（防止压枪）
      const waitTime = 400 + Math.random() * 500;
      await new Promise(r => setTimeout(r, waitTime));

      // 枪声
      await testHorn();

      log('✅ 发令完成！', 'success');
    }
  </script>
</body>
</html>
